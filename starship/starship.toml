# Shared starship config — pins the module behavior that used to drift between machines.

# Directory first; $all fills in every module not explicitly placed, in default order.
format = "$directory$hostname$all"

# Hostname renders only over SSH: remote prompts keep the "you are not local" cue.
# Username is dropped entirely — it's constant, the hostname alone carries the signal.
[username]
disabled = true

[hostname]
ssh_only = true
format = "on [$ssh_symbol$hostname]($style) "

# Show duration of the previous command when it took >= 2s.
[cmd_duration]
min_time = 2000
