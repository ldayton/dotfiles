# Deliberately empty. A run with no host named should provision nothing rather than whatever
# machine you happen to be sitting on — this file listed `localhost` once, and the first mistake
# it caused was provisioning the box the operator was typing on instead of the box they meant.
#
# Add the target under [dev] before running, here or in an inventory of your own:
#
#   [dev]
#   box.example.com
#   localhost ansible_connection=local
#
# An ad-hoc `-i 'host,'` list will not do: it places the host in `all`, and this play targets
# `dev`, so the run reports "skipping: no hosts matched" and changes nothing.
[dev]

[dev:vars]
ansible_python_interpreter=/usr/bin/python3
