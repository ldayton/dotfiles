# Deliberately empty: a run given no host should provision none, not whatever machine you are
# typing on. Name the target under [dev] here or in an inventory of your own.
#
# An ad-hoc `-i 'host,'` list will not do — it places the host in `all`, and this play targets
# `dev`, so the run reports "no hosts matched" and changes nothing.
[dev]

[dev:vars]
ansible_python_interpreter=/usr/bin/python3
