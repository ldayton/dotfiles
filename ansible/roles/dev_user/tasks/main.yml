---
# The order below is the whole design. The account is created first, out of packages the
# distribution already has, and then does the rest of the work itself: it installs Homebrew,
# owns the prefix, installs its own packages and configures its own home. Nothing here runs as
# a second account on the account's behalf, so nothing here has to share anything with one.
#
# What that buys, concretely: no prefix ownership to negotiate, no group to widen, no staging
# directory to hand a file between two users who cannot read each other's homes.

# acl first. Tasks below that become the provisioned account escalate from the invoking user,
# not from root -- a task-level become_user replaces the play's rather than chaining -- and
# Ansible can only pass a module payload between two unprivileged accounts via setfacl.
# Without this the run stops at the first such task with a permissions error about temporary
# files. This task itself becomes root, which needs no acl.
- name: Ensure acl is present, so module payloads can reach an unprivileged account
  ansible.builtin.package:
    name: acl
    state: present
  become: true

# The login shell and the Homebrew installer's prerequisites, from the distribution, before the
# account exists. The shell is the point: naming one the distribution ships is what lets the
# account be created before Homebrew, which is what lets the account install Homebrew itself.
# A cloud image carries curl and git but not reliably file, procps, a compiler or zsh, and the
# Homebrew installer reports the missing ones only after cloning itself into place.
- name: Packages the shell and the Homebrew installer need
  ansible.builtin.package:
    name: "{{ ['build-essential', 'curl', 'file', 'git', 'procps'] + [dev_user_shell_package] }}"
    state: present
  become: true
  when: ansible_facts['system'] == 'Linux'

# A home meant to live on another volume, on a filesystem that turns out to be the root one,
# means the volume did not mount -- `nofail` lets that happen quietly at boot. Checked before
# the account exists, because afterwards the only symptom is the root volume filling up.
- name: Which filesystem would the home be created on?
  ansible.builtin.shell: |
    set -o pipefail
    # Walk up to the nearest ancestor that exists: the home and its parents are usually both
    # absent on a first run, and df on a path that is not there exits 1.
    probe={{ dev_user_home | quote }}
    while [ ! -e "$probe" ]; do probe=$(dirname "$probe"); done
    df --output=source -- "$probe" | tail -1
    df --output=source -- / | tail -1
  args:
    executable: /bin/bash
  become: true
  register: dev_user_home_fs
  changed_when: false
  when: dev_user_home_require_separate_fs | bool

- name: Refuse a home that would land on the root volume
  ansible.builtin.fail:
    msg: >-
      dev_user_home is {{ dev_user_home }} and dev_user_home_require_separate_fs is set, but the
      nearest existing ancestor of that path is on the same filesystem as / -- both are
      {{ dev_user_home_fs.stdout_lines[1] | trim }}. The volume it was meant to live on is most
      likely not mounted: an fstab entry marked nofail leaves its mountpoint behind as an ordinary
      directory on the root volume, and the home would be created there without anything saying so.
  when:
    - dev_user_home_require_separate_fs | bool
    - (dev_user_home_fs.stdout_lines[0] | trim) == (dev_user_home_fs.stdout_lines[1] | trim)

# useradd does not check that the shell exists, so a missing one produces an account nobody can
# log into while every task still reports ok. The default is installed by the package task
# above; this covers a host that names a shell nothing here installs.
- name: Check that the login shell exists on the target
  ansible.builtin.stat:
    path: "{{ dev_user_shell }}"
  register: dev_user_shell_stat

- name: Refuse to create an account with a shell that is not there
  ansible.builtin.fail:
    msg: >-
      dev_user_shell is {{ dev_user_shell }}, which does not exist on this host. Either set
      dev_user_shell_package to the package providing it, or name a shell that is already
      present (/bin/bash on a stock Ubuntu).
  when: not (dev_user_shell_stat.stat.exists | default(false))

# A group is granted where it exists. The user module fails on a name it cannot find, which
# turns dev_user_groups into a list of things every target must already have -- docker on a box
# with no daemon is a name, not access.
- name: Read the groups this box has
  ansible.builtin.getent:
    database: group

- name: Which requested groups are actually here
  ansible.builtin.set_fact:
    dev_user_groups_present: "{{ dev_user_groups | select('in', ansible_facts.getent_group) | list }}"
    dev_user_groups_absent: "{{ dev_user_groups | reject('in', ansible_facts.getent_group) | list }}"

- name: Say which requested groups this box does not have
  ansible.builtin.debug:
    msg: >-
      Not on this box, so not granted: {{ dev_user_groups_absent | join(', ') }}.
  when: dev_user_groups_absent | length > 0

# HOME_MODE is 0750 on Ubuntu, so the home is not traversable by other accounts. That is the
# distribution's default for every user, not something this role arranges, and nothing below
# depends on widening it: the only account that reads anything in here is this one.
- name: Create the account
  ansible.builtin.user:
    name: "{{ dev_user_name }}"
    comment: "{{ dev_user_comment }}"
    shell: "{{ dev_user_shell }}"
    home: "{{ dev_user_home }}"
    groups: "{{ dev_user_groups_present }}"
    append: true
    create_home: true
    generate_ssh_key: true
    ssh_key_type: ed25519
    ssh_key_file: .ssh/id_ed25519
    ssh_key_comment: "{{ dev_user_name }}@{{ ansible_hostname }}"
  become: true
  register: dev_user_created

- name: Authorize keys for direct ssh
  ansible.posix.authorized_key:
    user: "{{ dev_user_name }}"
    key: "{{ item }}"
    state: present
  become: true
  loop: "{{ dev_user_authorized_keys }}"

# Before Homebrew, not after: the installer probes `sudo -n` before it will create anything
# under /home, so without this grant already in place it aborts on a fresh box. The account is
# created with a locked password, so this is the only kind of sudo it could ever have.
- name: Grant passwordless sudo
  ansible.builtin.copy:
    content: "{{ dev_user_name }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "{{ dev_user_sudoers_file }}"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
  become: true

# The account's own key, which the dotfiles clone authenticates with when the repo is private.
# It has to be registered on the git host by hand -- that step is a human's, so surface it
# rather than failing four tasks later with a bare Permission denied.
- name: Show the account's public key
  ansible.builtin.debug:
    msg:
      - "Add this to the git host before the clone step can succeed:"
      - "{{ dev_user_created.ssh_public_key | default('(key already existed; cat ' + dev_user_home + '/.ssh/id_ed25519.pub)') }}"

- name: Is Homebrew already here, and whose is it?
  ansible.builtin.stat:
    path: "{{ dev_user_brew_prefix }}"
  register: dev_user_brew_prefix_before

- name: Refuse a Homebrew prefix this account is not allowed to take over
  ansible.builtin.fail:
    msg: >-
      {{ dev_user_brew_prefix }} belongs to
      {{ dev_user_brew_prefix_before.stat.pw_name | default('another account') }}, and
      dev_user_brew_take_ownership is false. Homebrew is single-owner: {{ dev_user_name }} cannot
      install into a prefix somebody else owns. Either set dev_user_brew_take_ownership, chown the
      prefix by hand, or point dev_user_brew_prefix somewhere this account can own.
  when:
    - dev_user_brew_prefix_before.stat.isdir | default(false)
    - (dev_user_brew_prefix_before.stat.pw_name | default('')) != dev_user_name
    - not (dev_user_brew_take_ownership | bool)

# Ownership is metadata, so this copies nothing and costs seconds even on a full prefix -- the
# reason the old group-sharing arrangement existed was the 3.6G on disk, and a chown duplicates
# none of it. Gated on the top-level owner, which is the sentinel the installer itself sets last;
# when it fires it repairs the whole tree regardless of how mixed the ownership underneath is.
- name: Take ownership of a Homebrew prefix somebody else installed
  ansible.builtin.command:
    # Quoted, and the trailing colon is load-bearing: `chown user:` sets the group to that
    # user's login group, which is what the Homebrew installer itself does.
    cmd: "chown -R {{ dev_user_name }}: {{ dev_user_brew_prefix }}"
  become: true
  changed_when: true
  when:
    - dev_user_brew_prefix_before.stat.isdir | default(false)
    - (dev_user_brew_prefix_before.stat.pw_name | default('')) != dev_user_name
    - dev_user_brew_take_ownership | bool

# Run as the account itself, which is what makes it the owner: the installer chowns everything
# it creates to whoever invoked it. It refuses uid 0, and become_user means the uid is not 0.
# It calls sudo on its own rather than inheriting this play's escalation, which the grant above
# already covers.
- name: Install Homebrew
  ansible.builtin.shell: |
    set -o pipefail
    NONINTERACTIVE=1 bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  args:
    executable: /bin/bash
    creates: "{{ dev_user_brew_prefix }}/bin/brew"
  become: true
  become_user: "{{ dev_user_name }}"
  when:
    - dev_user_brew_install | bool
    - not (dev_user_brew_prefix_before.stat.isdir | default(false))

# Re-stat, and unconditionally: a skipped task overwrites its register with the skip, so a
# `when` here would erase the very fact it exists to refresh. Everything downstream reads this
# one, so it has to describe the prefix as it is after the install, not before it.
- name: Check whether the Homebrew prefix exists
  ansible.builtin.stat:
    path: "{{ dev_user_brew_prefix }}"
  register: dev_user_brew_prefix_stat

# Stated rather than assumed, the same way Claude Code is further down: an installer exiting 0
# is not the same as a brew that runs, and this is also the first time the play asks the account
# to use the prefix it now owns.
- name: Homebrew answers, as the account that owns it
  ansible.builtin.command: "{{ dev_user_brew_prefix }}/bin/brew --version"
  become: true
  become_user: "{{ dev_user_name }}"
  register: dev_user_brew_version
  changed_when: false
  when: dev_user_brew_prefix_stat.stat.isdir | default(false)

# Host keys are pinned before the first clone rather than accepted on sight. The account is
# created fresh above with an empty known_hosts, so accept_hostkey would take the trust-on-
# first-use branch every time, not as a rare fallback. Whoever wins that race serves a tree
# this play then links into ~/.zshrc and hands to brew bundle as a sudoer, so the clone is
# the wrong place to be lenient. GitHub publishes its keys over TLS, which is a verified
# channel; for any other host, set dev_user_git_host_keys explicitly.
- name: Fetch the git host's published SSH keys over TLS
  ansible.builtin.uri:
    url: "{{ dev_user_git_host_keys_url }}"
    return_content: true
  register: dev_user_git_host_meta
  when:
    - dev_user_git_host_keys | length == 0
    - dev_user_git_host_keys_url | length > 0

- name: Resolve which host keys to pin
  ansible.builtin.set_fact:
    dev_user_git_host_keys: "{{ dev_user_git_host_keys or (dev_user_git_host_meta.json.ssh_keys | default([])) }}"

# Only when something here actually speaks SSH: the dotfiles clone is HTTPS by default, while an
# overlay is private by nature and an SSH dotfiles URL is a supported override.
- name: Does anything here clone over SSH?
  ansible.builtin.set_fact:
    dev_user_wants_ssh: "{{ (dev_user_dotfiles_repo is search('^(ssh://|[^/]+@)'))
                            or (dev_user_overlay_repo | length > 0
                                and dev_user_overlay_repo is search('^(ssh://|[^/]+@)')) }}"

- name: Refuse to clone with no host key to verify against
  ansible.builtin.fail:
    msg: >-
      No SSH host keys resolved for {{ dev_user_git_host }}. Set dev_user_git_host_keys, or
      point dev_user_git_host_keys_url at an endpoint publishing them over TLS. Cloning
      without a pinned key would trust whatever answers on the network.
  when:
    - dev_user_wants_ssh
    - dev_user_git_host_keys | length == 0

- name: Pin the git host keys
  ansible.builtin.known_hosts:
    name: "{{ dev_user_git_host }}"
    key: "{{ dev_user_git_host }} {{ item }}"
    state: present
  become: true
  become_user: "{{ dev_user_name }}"
  loop: "{{ dev_user_git_host_keys }}"
  loop_control:
    label: "{{ item.split(' ')[0] }}"

- name: Clone the dotfiles
  ansible.builtin.git:
    repo: "{{ dev_user_dotfiles_repo }}"
    dest: "{{ dev_user_dotfiles_dest }}"
    version: "{{ dev_user_dotfiles_version }}"
    update: false
  become: true
  become_user: "{{ dev_user_name }}"
  register: dev_user_dotfiles_clone
  failed_when:
    - dev_user_dotfiles_clone.failed
    - "'Permission denied' not in (dev_user_dotfiles_clone.msg | default(''))"

- name: Explain a clone that failed on authentication
  ansible.builtin.fail:
    msg: >-
      Could not clone {{ dev_user_dotfiles_repo }} as {{ dev_user_name }}. That URL speaks SSH,
      which authenticates whether or not the repository is public — register the public key
      printed above with the git host and re-run, or point dev_user_dotfiles_repo at an HTTPS
      URL, which needs no credential for a public repository.
  when: "'Permission denied (publickey)' in (dev_user_dotfiles_clone.msg | default(''))"

# Before install.sh, not after. install.sh generates ~/.claude/settings.json through
# claude/build-settings, which requires jq and exits 1 without it; install.sh counts that as a
# failure and exits non-zero, so on any image that does not already ship jq -- which is a stock
# Ubuntu -- configuring the home before installing the tools failed the play. The Brewfile is
# where jq comes from, so the Brewfile goes first.
#
# brew runs as the account, reading the Brewfile out of the account's own clone. That is the
# whole of it: no staging copy, no second account that has to be able to read this home.
# `bundle check` is what makes it idempotent -- `brew bundle` alone always reports work done,
# and would mark the play changed on every run.
- name: Check whether the Brewfile is already satisfied
  ansible.builtin.command:
    cmd: "{{ dev_user_brew_prefix }}/bin/brew bundle check --file={{ dev_user_dotfiles_dest }}/Brewfile"
  become: true
  become_user: "{{ dev_user_name }}"
  register: dev_user_brew_check
  changed_when: false
  failed_when: false
  when:
    - dev_user_brewfile | bool
    - dev_user_brew_prefix_stat.stat.isdir | default(false)

- name: Install the Brewfile
  ansible.builtin.command:
    cmd: "{{ dev_user_brew_prefix }}/bin/brew bundle --file={{ dev_user_dotfiles_dest }}/Brewfile"
  become: true
  become_user: "{{ dev_user_name }}"
  when:
    - dev_user_brewfile | bool
    - dev_user_brew_prefix_stat.stat.isdir | default(false)
    - dev_user_brew_check.rc | default(0) != 0
  register: dev_user_brew_bundle
  changed_when: dev_user_brew_bundle.rc == 0

# The repo's own installer, run as the account it is configuring, rather than a second
# implementation of it here. Linking the configs, generating settings.json and seeding gitconfig
# were all reimplemented in this role, and both times the base repo changed one the role kept the
# old behaviour -- a rename of the settings file broke the run, and the filter tasks it left behind
# broke it again. install.sh already reports what it changed, refuses a dangling source, counts its
# failures and exits non-zero, so all of that arrives here for free.
#
# become_user gives sudo -H, so $HOME is the account's own; install.sh derives everything else from
# where it sits.
- name: Configure the home by running the repository's own installer
  ansible.builtin.command:
    cmd: ./install.sh
    chdir: "{{ dev_user_dotfiles_dest }}"
  become: true
  become_user: "{{ dev_user_name }}"
  # The Homebrew prefix has to be on PATH explicitly. install.sh generates settings.json through
  # claude/build-settings, which needs jq, and jq comes from the Brewfile -- so it lives in the
  # prefix, not in /usr/bin. `command` does not run a login shell, so none of the shell config
  # this role just linked has run, and `brew shellenv` with it. Without this the installer links
  # every config, fails only on settings.json, and exits non-zero.
  #
  # It went unnoticed because a GitHub runner ships apt's jq on the default PATH; on a stock
  # cloud image, which is what this role is for, there is no jq anywhere but the prefix.
  environment:
    PATH: "{{ dev_user_brew_prefix }}/bin:{{ ansible_facts.env.PATH }}"
  register: dev_user_dotfiles_install
  # It marks work with a tick and no-ops with an equals sign, which is the whole reason the dry run
  # and the already-linked check were worth porting.
  changed_when: "'✓' in dev_user_dotfiles_install.stdout"

# The installer puts everything under $HOME and refuses to run as root with SUDO_USER set, because
# that would land the binary in root's home and leave `claude` not found in the account's own shell.
# become_user runs this as the account itself, so the uid is not 0 and the check does not apply.
- name: Claude Code, in the account's own home
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://claude.ai/install.sh | bash -s {{ dev_user_claude_code_channel }}
  args:
    executable: /bin/bash
    creates: "{{ dev_user_home }}/.local/bin/claude"
  become: true
  become_user: "{{ dev_user_name }}"
  when: dev_user_claude_code | bool

# Stated rather than assumed, like the mount and the brew check above: the installer exiting 0 is
# not the same as a binary that runs, and the launcher is a symlink into a versions directory that
# a background update rewrites.
- name: Claude Code answers
  ansible.builtin.command: "{{ dev_user_home }}/.local/bin/claude --version"
  become: true
  become_user: "{{ dev_user_name }}"
  register: dev_user_claude_version
  changed_when: false
  when: dev_user_claude_code | bool

# The Brewfile installs this on macOS and cannot here: Homebrew has only a cask for Codex, and
# casks are macOS-only. npm is what OpenAI document beside the cask and it publishes the same
# version, so this is the same tool by another route rather than a substitute for it.
#
# Global, which with the account's own Homebrew node means the Homebrew prefix -- the account owns
# it, so no escalation is involved. npm is not on the PATH `command` gets, for the reason the
# installer above needs the same line: no login shell has run, so `brew shellenv` has not either.
#
# That whole sentence is about the account's own npm, so it is the one named, and the pair is
# skipped where it is absent rather than falling through to whatever npm the PATH turns up. A
# system npm installs into a prefix this account may not own and leaves the binary somewhere the
# check below does not look, which is what the executed-role job saw: it runs with the Brewfile
# off, the install went to the runner's own npm, and `{{ dev_user_brew_prefix }}/bin/codex` was
# never written. A box without the Brewfile has no Codex until it has one.
- name: Whether the account has an npm of its own to install with
  ansible.builtin.stat:
    path: "{{ dev_user_brew_prefix }}/bin/npm"
  register: dev_user_brew_npm

- name: Codex CLI, from npm
  community.general.npm:
    name: "@openai/codex"
    version: "{{ dev_user_codex_version or omit }}"
    executable: "{{ dev_user_brew_prefix }}/bin/npm"
    global: true
    state: present
  become: true
  become_user: "{{ dev_user_name }}"
  environment:
    PATH: "{{ dev_user_brew_prefix }}/bin:{{ ansible_facts.env.PATH }}"
  when:
    - dev_user_codex | bool
    - dev_user_brew_npm.stat.exists

# Stated rather than assumed, as with Claude Code above. npm reporting a package installed says
# the tarball unpacked; it does not say the launcher resolves or that the platform-specific binary
# it shells out to exists for this architecture.
#
# The PATH again, and not for the reason the install task has it: what npm links into the prefix is
# a script whose shebang is `/usr/bin/env node`, so running it needs node found the same way. Claude
# Code above gets away without this because what its installer leaves behind is a native binary that
# asks nothing of the PATH -- which is why the task said `node: No such file or directory` when it
# was written to that shape, on a box where the install itself had just succeeded.
- name: Codex answers
  ansible.builtin.command: "{{ dev_user_brew_prefix }}/bin/codex --version"
  become: true
  become_user: "{{ dev_user_name }}"
  register: dev_user_codex_reported_version
  environment:
    PATH: "{{ dev_user_brew_prefix }}/bin:{{ ansible_facts.env.PATH }}"
  changed_when: false
  when:
    - dev_user_codex | bool
    - dev_user_brew_npm.stat.exists

# The private overlay. This repo is public and deliberately knows nothing about any
# employer, so the default is empty and the whole block is skipped. Supply the repo in an
# untracked vars file to turn it on:  ansible-playbook ... -e @private.yml
- name: Clone the private overlay
  ansible.builtin.git:
    repo: "{{ dev_user_overlay_repo }}"
    dest: "{{ dev_user_overlay_dest }}"
    version: "{{ dev_user_overlay_version }}"
    update: false
  become: true
  become_user: "{{ dev_user_name }}"
  when: dev_user_overlay_repo | length > 0

- name: Link the private overlay
  ansible.builtin.include_tasks: links.yml
  vars:
    link_root: "{{ dev_user_overlay_dest }}"
    link_list: "{{ dev_user_overlay_links }}"
  when: dev_user_overlay_repo | length > 0
