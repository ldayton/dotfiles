---
# acl first. Every task below that becomes the provisioned account escalates from the invoking
# user, not from root -- a task-level become_user replaces the play's rather than chaining --
# and Ansible can only pass a module payload between two unprivileged accounts via setfacl.
# Without this the run stops at the first such task with a permissions error about temporary
# files. This task itself becomes root, which needs no acl.
- name: Ensure acl is present, so module payloads can reach an unprivileged account
  ansible.builtin.package:
    name: acl
    state: present
  become: true

# Homebrew first: the account's login shell lives inside the prefix, and so does every tool
# the Brewfile installs, so the prefix has to be there before the user is created or the first
# login has no shell to land in.
#
# The role installs it when it is missing. It used to only share a prefix somebody else had
# already put there, and on a stock cloud image -- which has neither Homebrew nor zsh -- that
# meant every brew task below skipped, the login shell had to be downgraded to /bin/bash, and
# the account came up without gh, zellij or anything else this repo is about. Nothing said so:
# a skipped task is a green tick. Every brew task is still gated on the prefix existing, for
# the host that sets dev_user_brew_install false -- including the ungated remediation below,
# where a bare find on a missing path exits 1 and would kill the play.
- name: Is Homebrew already here?
  ansible.builtin.stat:
    path: "{{ dev_user_brew_prefix }}"
  register: dev_user_brew_prefix_before

# Asked of the target rather than read out of ansible_user_id, which is gathered under the
# play's own become and therefore says root on every host. The answer decides who ends up
# owning the prefix, so getting it from the wrong place is not a cosmetic error.
# check_mode: false so it runs during --check too. A skipped command still registers, as an
# object with no stdout, and the guard below reads that stdout inside a `when` -- so without
# this a dry run dies on an undefined attribute instead of reporting what it would do.
- name: Which account is this play connected as?
  ansible.builtin.command: id -un
  become: false
  changed_when: false
  check_mode: false
  register: dev_user_connection_account

# Homebrew refuses to run as uid 0 and escalates on its own where it needs to, so it wants an
# unprivileged account that can sudo -- which is what this playbook already needs to become
# root at all. Stated here because the installer's own refusal talks about interactive shells
# and never mentions the connection, which is the thing to change.
- name: Refuse to install Homebrew over a root connection
  ansible.builtin.fail:
    msg: >-
      Homebrew will not install as root, and this play is connected as
      {{ dev_user_connection_account.stdout | trim }}. Connect as an unprivileged account with
      passwordless sudo, put Homebrew in {{ dev_user_brew_prefix }} by hand, or set
      dev_user_brew_install to false and accept an account without the Brewfile.
  when:
    - dev_user_brew_install | bool
    - not (dev_user_brew_prefix_before.stat.isdir | default(false))
    - (dev_user_connection_account.stdout | trim) == 'root'

# The installer's own prerequisites, installed before it rather than after it complains. A
# cloud image carries curl and git but not reliably file, procps or a compiler, and the
# installer reports that only once it has already cloned itself into place.
- name: Packages the Homebrew installer needs
  ansible.builtin.package:
    name: [build-essential, curl, file, git, procps]
    state: present
  become: true
  when:
    - dev_user_brew_install | bool
    - not (dev_user_brew_prefix_before.stat.isdir | default(false))
    - ansible_facts['system'] == 'Linux'

# become: false, against the play's root default. The installer refuses uid 0, and the account
# it does run as is the one that ends up owning the prefix -- which is the account every brew
# task below becomes, and the one that must already hold passwordless sudo, because the
# installer calls sudo itself rather than inheriting this play's escalation.
- name: Install Homebrew
  ansible.builtin.shell: |
    set -o pipefail
    NONINTERACTIVE=1 bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  args:
    executable: /bin/bash
    creates: "{{ dev_user_brew_prefix }}/bin/brew"
  become: false
  when:
    - dev_user_brew_install | bool
    - not (dev_user_brew_prefix_before.stat.isdir | default(false))

# Re-stat, and unconditionally: a skipped task overwrites its register with the skip, so a
# `when` here would erase the very fact it exists to refresh. Everything downstream reads this
# one, so it has to describe the prefix as it is after the install, not before it.
- name: Check whether the Homebrew prefix exists
  ansible.builtin.stat:
    path: "{{ dev_user_brew_prefix }}"
  register: dev_user_brew_prefix_stat

- name: Whoever owns the prefix is who runs brew
  ansible.builtin.set_fact:
    dev_user_brew_runner: >-
      {{ dev_user_brew_owner if dev_user_brew_owner | length > 0
         else (dev_user_brew_prefix_stat.stat.pw_name | default('root')) }}

# Stated rather than assumed, the same way Claude Code is further down: an installer exiting 0
# is not the same as a brew that runs, and on a first install this is also the first time the
# play becomes the account that owns the prefix.
- name: Homebrew answers
  ansible.builtin.command: "{{ dev_user_brew_prefix }}/bin/brew --version"
  become: true
  become_user: "{{ dev_user_brew_runner }}"
  register: dev_user_brew_version
  changed_when: false
  when: dev_user_brew_prefix_stat.stat.isdir | default(false)

- name: Ensure the shared brew group exists
  ansible.builtin.group:
    name: "{{ dev_user_brew_group }}"
    state: present
  become: true
  when:
    - dev_user_brew_share_mode == 'group'
    - dev_user_brew_prefix_stat.stat.isdir | default(false)

- name: Give the brew group ownership of the prefix
  ansible.builtin.file:
    path: "{{ dev_user_brew_prefix }}"
    group: "{{ dev_user_brew_group }}"
    recurse: true
  become: true
  when:
    - dev_user_brew_share_mode == 'group'
    - dev_user_brew_prefix_stat.stat.isdir | default(false)

# Mode is set with find rather than the file module's recurse, because setgid belongs on
# directories and nowhere else. The module's symbolic modes have no "directories only"
# form: g+rwXs limits the execute bit to directories via X, but applies s to every regular
# file too. That turns each of the prefix's binaries into a setgid executable while g+w
# leaves them group-writable, so any local account on the machine can enter the group
# through any one of them and then rewrite the rest, including the login shell of whoever
# holds sudo.
- name: Setgid and group-write on directories, so new packages inherit the group
  ansible.builtin.command:
    cmd: find {{ dev_user_brew_prefix }} -type d ! -perm -g+ws -printf . -exec chmod g+rwxs {} +
  become: true
  register: dev_user_brew_dirs
  changed_when: dev_user_brew_dirs.stdout | length > 0
  when:
    - dev_user_brew_share_mode == 'group'
    - dev_user_brew_prefix_stat.stat.isdir | default(false)

# Group-write reaches every binary in the prefix, the login shell among them, and this role
# puts the account it provisions in sudo. Any other member of the brew group therefore gets a
# path to root by rewriting a binary a sudoer runs. Setgid is not needed for that -- membership
# is enough -- so treat the group as equivalent to sudo on this host, and keep it to accounts
# that already have it. That is why readonly is the default.
- name: Group-write on files, without setgid
  ansible.builtin.command:
    cmd: find {{ dev_user_brew_prefix }} -type f ! -perm -g+w -printf . -exec chmod g+w {} +
  become: true
  register: dev_user_brew_files
  changed_when: dev_user_brew_files.stdout | length > 0
  when:
    - dev_user_brew_share_mode == 'group'
    - dev_user_brew_prefix_stat.stat.isdir | default(false)

# Remediation for a prefix an earlier revision of this role already widened. Both bits are
# required in the predicate: setgid alone is how a handful of formulae legitimately ship,
# and stripping it off those would break them. Setgid *and* group-writable together is the
# combination nothing installs on purpose, and the one that lets a local account enter the
# group and then rewrite what it just entered. Left ungated so a prefix damaged under
# 'group' is still repaired after switching back to 'readonly'.
- name: Strip setgid from group-writable files in the prefix
  ansible.builtin.command:
    cmd: find {{ dev_user_brew_prefix }} -type f -perm -g+s -perm -g+w -printf . -exec chmod g-s {} +
  become: true
  register: dev_user_brew_setgid
  changed_when: dev_user_brew_setgid.stdout | length > 0
  when: dev_user_brew_prefix_stat.stat.isdir | default(false)

# A home meant to live on another volume, on a filesystem that turns out to be the root one,
# means the volume did not mount -- `nofail` lets that happen quietly at boot. Checked before
# the account exists, because afterwards the only symptom is the root volume filling up.
- name: Which filesystem would the home be created on?
  ansible.builtin.shell: |
    set -o pipefail
    # Walk up to the nearest ancestor that exists: the home and its parents are usually both
    # absent on a first run, and df on a path that is not there exits 1.
    probe={{ dev_user_home | quote }}
    while [ ! -e "$probe" ]; do probe=$(dirname "$probe"); done
    df --output=source -- "$probe" | tail -1
    df --output=source -- / | tail -1
  args:
    executable: /bin/bash
  become: true
  register: dev_user_home_fs
  changed_when: false
  when: dev_user_home_require_separate_fs | bool

- name: Refuse a home that would land on the root volume
  ansible.builtin.fail:
    msg: >-
      dev_user_home is {{ dev_user_home }} and dev_user_home_require_separate_fs is set, but the
      nearest existing ancestor of that path is on the same filesystem as / -- both are
      {{ dev_user_home_fs.stdout_lines[1] | trim }}. The volume it was meant to live on is most
      likely not mounted: an fstab entry marked nofail leaves its mountpoint behind as an ordinary
      directory on the root volume, and the home would be created there without anything saying so.
  when:
    - dev_user_home_require_separate_fs | bool
    - (dev_user_home_fs.stdout_lines[0] | trim) == (dev_user_home_fs.stdout_lines[1] | trim)

# The default login shell is brew's zsh, and the Brewfile that would install it is staged out
# of the dotfiles clone -- which lives in a home that does not exist yet. So the shell is
# installed here, on its own, rather than waiting for the bundle: it is the one formula the
# account cannot be created without. Named from dev_user_shell rather than hardcoded, so a
# host that points the shell at some other formula in the prefix gets that one installed.
- name: Install the login shell, when it lives in the Homebrew prefix
  ansible.builtin.command:
    cmd: "{{ dev_user_brew_prefix }}/bin/brew install {{ dev_user_shell | basename }}"
    creates: "{{ dev_user_shell }}"
  become: true
  become_user: "{{ dev_user_brew_runner }}"
  when:
    - dev_user_brew_prefix_stat.stat.isdir | default(false)
    - dev_user_shell.startswith(dev_user_brew_prefix ~ '/')

# useradd does not check that the shell exists, so a missing one produces an account nobody
# can log into while every task still reports ok. The check stays even now that the task above
# installs it: dev_user_brew_install can be off, the prefix can be absent, and a host is free
# to name a shell that lives nowhere near Homebrew.
- name: Check that the login shell exists on the target
  ansible.builtin.stat:
    path: "{{ dev_user_shell }}"
  register: dev_user_shell_stat

- name: Refuse to create an account with a shell that is not there
  ansible.builtin.fail:
    msg: >-
      dev_user_shell is {{ dev_user_shell }}, which does not exist on this host. Install it
      first, or set dev_user_shell to a shell that is present (/bin/bash on a stock Ubuntu).
      A shell inside {{ dev_user_brew_prefix }} means Homebrew is not there either -- leave
      dev_user_brew_install true and the role will put both in place.
  when: not (dev_user_shell_stat.stat.exists | default(false))

# A group is granted where it exists. The user module fails on a name it cannot find, which
# turns dev_user_groups into a list of things every target must already have -- docker on a box
# with no daemon is a name, not access. Same treatment the brew prefix gets above.
- name: Read the groups this box has
  ansible.builtin.getent:
    database: group

- name: Which requested groups are actually here
  ansible.builtin.set_fact:
    dev_user_groups_present: "{{ dev_user_groups | select('in', ansible_facts.getent_group) | list }}"
    dev_user_groups_absent: "{{ dev_user_groups | reject('in', ansible_facts.getent_group) | list }}"

- name: Say which requested groups this box does not have
  ansible.builtin.debug:
    msg: >-
      Not on this box, so not granted: {{ dev_user_groups_absent | join(', ') }}.
  when: dev_user_groups_absent | length > 0

- name: Create the account
  ansible.builtin.user:
    name: "{{ dev_user_name }}"
    comment: "{{ dev_user_comment }}"
    shell: "{{ dev_user_shell }}"
    home: "{{ dev_user_home }}"
    groups: "{{ dev_user_groups_present + ([dev_user_brew_group] if dev_user_brew_share_mode == 'group' else []) }}"
    append: true
    create_home: true
    generate_ssh_key: true
    ssh_key_type: ed25519
    ssh_key_file: .ssh/id_ed25519
    ssh_key_comment: "{{ dev_user_name }}@{{ ansible_hostname }}"
  become: true
  register: dev_user_created

- name: Authorize keys for direct ssh
  ansible.posix.authorized_key:
    user: "{{ dev_user_name }}"
    key: "{{ item }}"
    state: present
  become: true
  loop: "{{ dev_user_authorized_keys }}"

- name: Grant passwordless sudo
  ansible.builtin.copy:
    content: "{{ dev_user_name }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/60-{{ dev_user_name }}"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
  become: true
  when: dev_user_sudo_nopasswd | bool

- name: Withdraw a sudo grant that is no longer asked for
  ansible.builtin.file:
    path: "/etc/sudoers.d/60-{{ dev_user_name }}"
    state: absent
  become: true
  when: not (dev_user_sudo_nopasswd | bool)

# The account's own key, which is what the dotfiles clone below authenticates with. It has
# to be registered on the git host by hand -- that step is a human's, so surface it rather
# than failing four tasks later with a bare Permission denied.
- name: Show the account's public key
  ansible.builtin.debug:
    msg:
      - "Add this to the git host before the clone step can succeed:"
      - "{{ dev_user_created.ssh_public_key | default('(key already existed; cat ' + dev_user_home + '/.ssh/id_ed25519.pub)') }}"

# Host keys are pinned before the first clone rather than accepted on sight. The account is
# created fresh above with an empty known_hosts, so accept_hostkey would take the trust-on-
# first-use branch every time, not as a rare fallback. Whoever wins that race serves a tree
# this play then links into ~/.zshrc and hands to brew bundle as a sudoer, so the clone is
# the wrong place to be lenient. GitHub publishes its keys over TLS, which is a verified
# channel; for any other host, set dev_user_git_host_keys explicitly.
- name: Fetch the git host's published SSH keys over TLS
  ansible.builtin.uri:
    url: "{{ dev_user_git_host_keys_url }}"
    return_content: true
  register: dev_user_git_host_meta
  when:
    - dev_user_git_host_keys | length == 0
    - dev_user_git_host_keys_url | length > 0

- name: Resolve which host keys to pin
  ansible.builtin.set_fact:
    dev_user_git_host_keys: "{{ dev_user_git_host_keys or (dev_user_git_host_meta.json.ssh_keys | default([])) }}"

# Only when something here actually speaks SSH: the dotfiles clone is HTTPS by default, while an
# overlay is private by nature and an SSH dotfiles URL is a supported override.
- name: Does anything here clone over SSH?
  ansible.builtin.set_fact:
    dev_user_wants_ssh: "{{ (dev_user_dotfiles_repo is search('^(ssh://|[^/]+@)'))
                            or (dev_user_overlay_repo | length > 0
                                and dev_user_overlay_repo is search('^(ssh://|[^/]+@)')) }}"

- name: Refuse to clone with no host key to verify against
  ansible.builtin.fail:
    msg: >-
      No SSH host keys resolved for {{ dev_user_git_host }}. Set dev_user_git_host_keys, or
      point dev_user_git_host_keys_url at an endpoint publishing them over TLS. Cloning
      without a pinned key would trust whatever answers on the network.
  when:
    - dev_user_wants_ssh
    - dev_user_git_host_keys | length == 0

- name: Pin the git host keys
  ansible.builtin.known_hosts:
    name: "{{ dev_user_git_host }}"
    key: "{{ dev_user_git_host }} {{ item }}"
    state: present
  become: true
  become_user: "{{ dev_user_name }}"
  loop: "{{ dev_user_git_host_keys }}"
  loop_control:
    label: "{{ item.split(' ')[0] }}"

- name: Clone the dotfiles
  ansible.builtin.git:
    repo: "{{ dev_user_dotfiles_repo }}"
    dest: "{{ dev_user_dotfiles_dest }}"
    version: "{{ dev_user_dotfiles_version }}"
    update: false
  become: true
  become_user: "{{ dev_user_name }}"
  register: dev_user_dotfiles_clone
  failed_when:
    - dev_user_dotfiles_clone.failed
    - "'Permission denied' not in (dev_user_dotfiles_clone.msg | default(''))"

- name: Explain a clone that failed on authentication
  ansible.builtin.fail:
    msg: >-
      Could not clone {{ dev_user_dotfiles_repo }} as {{ dev_user_name }}. That URL speaks SSH,
      which authenticates whether or not the repository is public — register the public key
      printed above with the git host and re-run, or point dev_user_dotfiles_repo at an HTTPS
      URL, which needs no credential for a public repository.
  when: "'Permission denied (publickey)' in (dev_user_dotfiles_clone.msg | default(''))"

# The repo's own installer, run as the account it is configuring, rather than a second
# implementation of it here. Linking the configs, generating settings.json and seeding gitconfig
# were all reimplemented in this role, and both times the base repo changed one the role kept the
# old behaviour -- a rename of the settings file broke the run, and the filter tasks it left behind
# broke it again. install.sh already reports what it changed, refuses a dangling source, counts its
# failures and exits non-zero, so all of that arrives here for free.
#
# become_user gives sudo -H, so $HOME is the account's own; install.sh derives everything else from
# where it sits.
- name: Configure the home by running the repository's own installer
  ansible.builtin.command:
    cmd: ./install.sh
    chdir: "{{ dev_user_dotfiles_dest }}"
  become: true
  become_user: "{{ dev_user_name }}"
  register: dev_user_dotfiles_install
  # It marks work with a tick and no-ops with an equals sign, which is the whole reason the dry run
  # and the already-linked check were worth porting.
  changed_when: "'✓' in dev_user_dotfiles_install.stdout"

# The installer puts everything under $HOME and refuses to run as root with SUDO_USER set, because
# that would land the binary in root's home and leave `claude` not found in the account's own shell.
# become_user runs this as the account itself, so the uid is not 0 and the check does not apply.
- name: Claude Code, in the account's own home
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://claude.ai/install.sh | bash -s {{ dev_user_claude_code_channel }}
  args:
    executable: /bin/bash
    creates: "{{ dev_user_home }}/.local/bin/claude"
  become: true
  become_user: "{{ dev_user_name }}"
  when: dev_user_claude_code | bool

# Stated rather than assumed, like the mount and the runner service elsewhere: the installer
# exiting 0 is not the same as a binary that runs, and the launcher is a symlink into a versions
# directory that a background update rewrites.
- name: Claude Code answers
  ansible.builtin.command: "{{ dev_user_home }}/.local/bin/claude --version"
  become: true
  become_user: "{{ dev_user_name }}"
  register: dev_user_claude_version
  changed_when: false
  when: dev_user_claude_code | bool

# Packages live in the shared prefix, so they are installed once by whoever owns it rather
# than per account. `bundle check` is what makes this idempotent -- `brew bundle` alone
# always reports work done, and would mark the play changed on every run.
# brew runs as whoever owns the prefix, and that account cannot read the Brewfile where it
# lands: useradd honours HOME_MODE, which is 0750 on Ubuntu, so the new home is not
# traversable by anyone else. Staging it into a root-owned directory keeps the read working
# without widening the home, and without leaving the path somewhere another local account
# could pre-create it as a symlink for root to follow.
- name: Create a root-owned directory to stage the Brewfile in
  ansible.builtin.file:
    path: "{{ dev_user_brew_stage_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when:
    - dev_user_brewfile | bool
    - dev_user_brew_prefix_stat.stat.isdir | default(false)

- name: Stage the Brewfile where the prefix owner can read it
  ansible.builtin.copy:
    src: "{{ dev_user_dotfiles_dest }}/Brewfile"
    dest: "{{ dev_user_brew_stage_dir }}/Brewfile"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  become: true
  when:
    - dev_user_brewfile | bool
    - dev_user_brew_prefix_stat.stat.isdir | default(false)

- name: Check whether the Brewfile is already satisfied
  ansible.builtin.command:
    cmd: "{{ dev_user_brew_prefix }}/bin/brew bundle check --file={{ dev_user_brew_stage_dir }}/Brewfile"
  become: true
  become_user: "{{ dev_user_brew_runner }}"
  register: dev_user_brew_check
  changed_when: false
  failed_when: false
  when:
    - dev_user_brewfile | bool
    - dev_user_brew_prefix_stat.stat.isdir | default(false)

- name: Install the Brewfile
  ansible.builtin.command:
    cmd: "{{ dev_user_brew_prefix }}/bin/brew bundle --file={{ dev_user_brew_stage_dir }}/Brewfile"
  become: true
  become_user: "{{ dev_user_brew_runner }}"
  when:
    - dev_user_brewfile | bool
    - dev_user_brew_prefix_stat.stat.isdir | default(false)
    - dev_user_brew_check.rc | default(0) != 0
  register: dev_user_brew_bundle
  changed_when: dev_user_brew_bundle.rc == 0

# The private overlay. This repo is public and deliberately knows nothing about any
# employer, so the default is empty and the whole block is skipped. Supply the repo in an
# untracked vars file to turn it on:  ansible-playbook ... -e @private.yml
- name: Clone the private overlay
  ansible.builtin.git:
    repo: "{{ dev_user_overlay_repo }}"
    dest: "{{ dev_user_overlay_dest }}"
    version: "{{ dev_user_overlay_version }}"
    update: false
  become: true
  become_user: "{{ dev_user_name }}"
  when: dev_user_overlay_repo | length > 0

- name: Link the private overlay
  ansible.builtin.include_tasks: links.yml
  vars:
    link_root: "{{ dev_user_overlay_dest }}"
    link_list: "{{ dev_user_overlay_links }}"
  when: dev_user_overlay_repo | length > 0
