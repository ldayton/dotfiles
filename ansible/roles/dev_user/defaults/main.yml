---
# The account this role provisions. Everything carrying identity -- ssh keys, gh tokens,
# ~/.claude, shell and atuin history -- lands inside its home and is shared with nobody.
dev_user_name: lily
dev_user_comment: "Lily Dayton"
# Empty by default. Sudo on a box that belongs to other things is a grant worth naming per
# host rather than inheriting: `-e '{"dev_user_groups":["sudo"]}'`, or set it here for a
# machine that is genuinely yours alone.
dev_user_groups: []

# ubuntu logs in on brew's zsh rather than /usr/bin/zsh, so the same choice here keeps the
# two accounts on one shell. It does mean login depends on dev_user_brew_prefix being readable.
dev_user_shell: "{{ dev_user_brew_prefix }}/bin/zsh"

# Point this at a larger or faster volume when the root one is small: useradd creates missing
# parents, so any path works. Instance-store volumes are wiped on stop/start and on any instance
# replacement, so a home on one is disposable by construction — keys, tokens and history included.
#
# The requirement below is on by default and is the reason: a volume mounted `nofail` that does not
# come up leaves its mountpoint as an ordinary directory on the root filesystem, so the home is
# created there instead and nothing says so. With the default home that check is trivially true, so
# it costs nothing until the day somebody points this at a volume and the volume is not there.
# Set it false for a machine where the root volume is genuinely the intended home.
dev_user_home: "/home/{{ dev_user_name }}"
dev_user_home_require_separate_fs: true
dev_user_dotfiles_repo: git@github.com:ldayton/dotfiles.git
# A variable for the same reason the overlay's is: pinning the branch, or provisioning from a
# commit that is not on main, should not require editing the task. Hardcoding it meant the role
# could only ever clone main, which CI found the moment it provisioned from a pull request.
dev_user_dotfiles_version: main
dev_user_dotfiles_dest: "{{ dev_user_home }}/source/dotfiles"

# Public keys authorized to log in as this user. Empty means no direct ssh -- reach the
# account with `sudo -iu lily` instead, which is enough to provision it.
dev_user_authorized_keys: []

dev_user_brew_prefix: /home/linuxbrew/.linuxbrew
dev_user_brew_group: brew

# Homebrew is 3.6G and officially single-owner. Rather than pay that twice:
#   group    -- a shared group owns the prefix and both accounts may install. Convenient,
#               and the cost is occasional permission repair after a brew upgrade.
#   readonly -- the prefix is left alone. Binaries run fine for everyone; installs happen
#               as whoever owns it (`sudo -u ubuntu brew install ...`). Nothing to break.
dev_user_brew_share_mode: readonly

# Whoever owns the prefix runs brew. Empty means ask the filesystem, which is the only answer
# that is true everywhere: the prefix's owner IS the account that installed it. A literal here was
# the cloud image's account name, and it was wrong on the first machine that was not that image --
# the run then tried to become a user who did not exist and failed on a temp-file permission it
# could not set.
dev_user_brew_owner: ""

# Private overlay, off by default -- this repo stays portable and employer-agnostic. Set
# dev_user_overlay_repo in an untracked vars file (see private.yml.example) to enable.
dev_user_overlay_repo: ""
dev_user_overlay_version: main
dev_user_overlay_dest: "{{ dev_user_home }}/dev/private-dotfiles"
dev_user_overlay_links:
  - {src: claude/CLAUDE.local.md, dest: .claude/CLAUDE.local.md}
  - {src: zsh/zshrc.local, dest: .zshrc.local}
  - {src: gh/policy.sh, dest: .config/gh-wrapper/policy.sh}

# The git host is pinned before the first clone instead of trusted on sight. GitHub
# publishes its SSH host keys over TLS, which is a verified channel; for any other host,
# set dev_user_git_host_keys directly and leave the URL empty.
dev_user_git_host: github.com
dev_user_git_host_keys_url: https://api.github.com/meta
dev_user_git_host_keys: []

# Root-owned, so the prefix owner can read the staged Brewfile without the new home being
# made traversable, and so no other local account can pre-place the path.
dev_user_brew_stage_dir: /var/lib/dev-user-role

# Whether to install the Brewfile at all. Off by default: provisioning an account and populating a
# machine are different errands, and forty-odd formulae is minutes of side effect for something
# nobody asked for. Ask for it in the same breath as the account:
#
#   ansible-playbook ... -e dev_user_brewfile=true -e dev_user_claude_code=true
dev_user_brewfile: false

# Claude Code, installed into the account's own home by Anthropic's native installer. Off by
# default for the reason the Brewfile is: installing software is not the same act as making an
# account to install it under. Set the
# channel to "stable" for the roughly week-old release, or to an exact version to pin one; empty
# means the default channel. A native install updates itself in the background, which is right for
# something used interactively and wrong for anything that has to be reproducible -- pin it if this
# account is ever something a build depends on.
#
# apt is the alternative: Anthropic publish a signed repository, which trades the self-update for a
# GPG-verified package and a system-wide install. The native installer is what this uses because it
# keeps the tool inside the home, like everything else this role puts there.
dev_user_claude_code: false
dev_user_claude_code_channel: ""
