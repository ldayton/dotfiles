---
# The account this role provisions: an ordinary user of the box, not a tenant on it. Everything
# carrying identity -- ssh keys, gh tokens, ~/.claude, shell and atuin history -- lands inside
# its home and is shared with nobody, but the box itself is hers: she owns the Homebrew prefix,
# installs her own packages, and reaches root without re-authenticating.
dev_user_name: lily
dev_user_comment: "Lily Dayton"
# Supplementary groups, granted where the box has them. A name the box does not know is
# reported and skipped rather than failing the run.
dev_user_groups: []

# Passwordless sudo is not optional and has no flag. The account is created with a locked
# password, so password sudo could never succeed -- the choice was never "which kind of sudo",
# it was "sudo or none". The Homebrew installer also probes `sudo -n` before it will touch
# /home, so the grant has to exist before the prefix does. It is written as a drop-in rather
# than group membership: one file to read, one file to delete, and visudo checks it first.
dev_user_sudoers_file: "/etc/sudoers.d/60-{{ dev_user_name }}"

# The distribution's zsh, not Homebrew's. They are the same release -- 5.9 -- so the only thing
# the Homebrew one ever bought was matching the cloud image's own account, which stopped being
# a consideration when this account became the one you log into. Naming a shell outside the
# prefix is what lets the account be created before Homebrew exists, which in turn is what lets
# the account install Homebrew itself. The Brewfile still installs zsh; it just isn't this.
dev_user_shell: /usr/bin/zsh
dev_user_shell_package: zsh

# Point this at a larger volume when the root one is small. An instance store is wiped on stop/start,
# so a home on one is disposable by construction — keys, tokens and history included.
#
# The check below is off by default because the default home is /home/<name> on the root volume,
# and demanding a separate filesystem for it failed every ordinary box before it had done anything.
# Turn it on with a dev_user_home you meant to put elsewhere, and it earns its keep: `nofail` turns
# a volume that did not come up into an ordinary directory, so without the check the home lands on
# the root filesystem with nothing at all to say so.
dev_user_home: "/home/{{ dev_user_name }}"
dev_user_home_require_separate_fs: false
# HTTPS, not SSH: this repository is public, and SSH authenticates whether or not the other end is,
# so an SSH URL made provisioning wait on somebody registering a freshly generated key. Override
# with an SSH URL for a private fork; the host-key pinning below covers it.
dev_user_dotfiles_repo: https://github.com/ldayton/dotfiles.git
# A variable for the same reason the overlay's is: pinning the branch, or provisioning from a
# commit that is not on main, should not require editing the task. Hardcoding it meant the role
# could only ever clone main, which CI found the moment it provisioned from a pull request.
dev_user_dotfiles_version: main
dev_user_dotfiles_dest: "{{ dev_user_home }}/source/dotfiles"

# Public keys authorized to log in as this user. Empty means no direct ssh -- reach the
# account with `sudo -iu lily` instead, which is enough to provision it.
dev_user_authorized_keys: []

dev_user_brew_prefix: /home/linuxbrew/.linuxbrew

# Install Homebrew when the prefix is not there. On by default: every tool the Brewfile carries
# lives inside the prefix, so a role that only ever shared an existing one produced an account
# with none of them on a machine that had never had brew -- which is every fresh cloud image.
# Set it false to provision an account with no Homebrew at all; the brew tasks then skip.
dev_user_brew_install: true

# Homebrew is officially single-owner, and this role takes it at its word: the account owns the
# prefix and runs brew as itself. A prefix somebody else installed is chowned over on the first
# run -- seconds, and it copies nothing, because ownership is not disk.
#
# The cost is real and worth stating: whoever owned it before can still run every binary in the
# prefix, but can no longer `brew install`. On a box where another account needs to install its
# own packages, this is the wrong role.
#
# The alternative, sharing the prefix through a group, is what this replaced. It needed setgid on
# directories, group-write across the tree, and a repair pass for the combination of the two --
# and since group-write reaches the login shell of an account holding sudo, membership was
# equivalent to root anyway. Single ownership is both simpler and the supported configuration.
dev_user_brew_take_ownership: true

# Private overlay, off by default -- this repo stays portable and employer-agnostic. Set
# dev_user_overlay_repo in an untracked vars file (see private.yml.example) to enable.
dev_user_overlay_repo: ""
dev_user_overlay_version: main
dev_user_overlay_dest: "{{ dev_user_home }}/dev/private-dotfiles"
dev_user_overlay_links:
  - {src: claude/CLAUDE.local.md, dest: .claude/CLAUDE.local.md}
  - {src: zsh/zshrc.local, dest: .zshrc.local}
  - {src: gh/policy.sh, dest: .config/gh-wrapper/policy.sh}

# The git host is pinned before the first clone instead of trusted on sight. GitHub
# publishes its SSH host keys over TLS, which is a verified channel; for any other host,
# set dev_user_git_host_keys directly and leave the URL empty.
dev_user_git_host: github.com
dev_user_git_host_keys_url: https://api.github.com/meta
dev_user_git_host_keys: []

# On by default. Provisioning an account and populating a machine were treated as different
# errands, and the result was an account that had gh in its PATH via a wrapper, a gh.account
# convention in its gitconfig and no gh -- the tools this repo configures are the point of it.
# Forty-odd formulae is still minutes of side effect, so `-e dev_user_brewfile=false` for a run
# that should only make the account.
dev_user_brewfile: true

# Claude Code, installed into the account's own home by Anthropic's native installer. On for the
# reason the Brewfile is. Set the channel to "stable" for the roughly week-old release, or to an
# exact version to pin one; empty means the default channel. A native install updates itself in
# the background, which is right for something used interactively and wrong for anything that has
# to be reproducible -- pin it if this account is ever something a build depends on.
#
# apt is the alternative: Anthropic publish a signed repository, which trades the self-update for a
# GPG-verified package and a system-wide install. The native installer is what this uses because it
# keeps the tool inside the home, like everything else this role puts there.
dev_user_claude_code: true
dev_user_claude_code_channel: ""
