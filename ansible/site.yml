---
# Provisions a namespaced dev account on a box that belongs to other things too. Run it
# from an account with sudo -- passwordless, because the Homebrew installer calls sudo itself
# rather than inheriting this play's escalation. Outside the new home it touches the Homebrew
# prefix (installing it when absent, as the invoking account, which then owns it), the
# installer's apt prerequisites, and the Homebrew group when dev_user_brew_share_mode is
# 'group'.
#
#   ansible-playbook -i inventory.ini site.yml --check     # dry run first
#   ansible-playbook -i inventory.ini site.yml
#
# The inventory ships empty, so name the target under [dev] first. `--check` cannot reach the clone:
# `uri` has no check mode, so the host-key fetch is skipped and the guard refusing an unpinned clone
# fires on an empty list rather than a real absence.
#
# become at play level makes root the default for tasks that name no become_user. It does NOT
# make the other tasks hop root -> target: a task-level become_user replaces the play's, it does
# not chain, so those escalations still run invoking-user -> target. Ansible can only hand a
# module payload between two unprivileged accounts with setfacl, so the role installs acl
# before the first such task rather than relying on it being present.
- name: Provision the dev user
  hosts: dev
  gather_facts: true
  become: true
  roles:
    - dev_user
