name: ci

# This repo makes cross-platform claims it has never once tested. Everything below is a check that
# a review had to make by reading: whether the shell parses under both shells, whether install.sh
# writes nothing in a dry run, whether a second run is a no-op, and whether the playbook lints.
#
# macOS is the half that matters most. Nothing here has ever run on a Mac, and the review that
# found `readlink -f`, `chattr`, keg-only `util-linux` and the Intel-Mac brew prefix found all four
# by inspection alone.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    name: shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Install only what is missing. Both runner images already carry most of this, and touching
      # brew at all pulls in a tap-trust warning about taps the macOS image happens to have tapped.
      - name: Tools the checks need
        run: |
          missing=""
          for t in shellcheck jq zsh; do command -v "$t" >/dev/null || missing="$missing $t"; done
          [ -z "$missing" ] && { echo "all present"; exit 0; }
          echo "installing:$missing"
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install -q $missing
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq $missing
          fi

      - name: shellcheck
        run: shellcheck -s bash install.sh gh/gh git/credential-gh-account claude/build-settings

      - name: The shells parse it
        run: |
          for f in install.sh gh/gh claude/build-settings; do bash -n "$f"; done
          zsh -n zsh/zshrc

      - name: The configs parse
        run: |
          python3 .github/scripts/check-json.py \
            claude/settings.base.json vscode/settings.json zed/settings.json zed/keymap.json
          python3 -c "import tomllib,sys; [tomllib.load(open(f,'rb')) for f in sys.argv[1:]]" \
            atuin/config.toml starship/starship.toml

      - name: A dry run writes nothing
        run: |
          fake="$(mktemp -d)"
          HOME="$fake" ./install.sh --dry-run
          found="$(find "$fake" -mindepth 1 | wc -l)"
          [ "$found" -eq 0 ] || { echo "dry run created $found path(s)"; find "$fake" -mindepth 1; exit 1; }

      - name: A real run installs, and a second run changes nothing
        run: |
          fake="$(mktemp -d)"
          HOME="$fake" ./install.sh
          [ -L "$fake/.zshrc" ] || { echo ".zshrc was not linked"; exit 1; }
          [ -f "$fake/.claude/settings.json" ] && [ ! -L "$fake/.claude/settings.json" ] \
            || { echo "settings.json should be a generated file, not a link"; exit 1; }
          HOME="$fake" ./install.sh | tee second.log
          grep -q "Already linked" second.log || { echo "second run reported no no-ops"; exit 1; }
          ! grep -q "✓ Linked" second.log || { echo "second run relinked something"; exit 1; }

  ansible:
    name: ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Ansible and its linter
        run: pip install --quiet ansible-core ansible-lint

      - name: The collections the role declares
        run: ansible-galaxy collection install -r ansible/requirements.yml

      # Neither of these would have caught the handler and shell defects a real run found, which is
      # said here so nobody reads a green tick as more than it is: this is the floor, not the proof.
      - name: The playbook parses
        run: ansible-playbook -i ansible/inventory.ini ansible/site.yml --syntax-check

      - name: The playbook lints
        run: ansible-lint ansible/site.yml

  role:
    name: ansible role (executed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Ansible
        run: pip install --quiet ansible-core

      - name: The collections the role declares
        run: ansible-galaxy collection install -r ansible/requirements.yml

      # The job the other two cannot do. Parsing found none of the defects a real run has: a link
      # list naming a renamed file, tasks configuring a filter for a path that no longer exists, a
      # login shell that does not exist, brew tasks ungated on a prefix that is absent, a variable
      # referenced three times and defined none. Every one of those passed --syntax-check and
      # ansible-lint. A runner is a disposable machine with sudo, which is what this role wants.
      #
      # One blind spot worth naming, because it hid a real defect: the runner ships apt's jq on
      # the default PATH, so this job cannot catch install.sh failing to find the jq that comes
      # from the Brewfile. On a stock cloud image jq exists only inside the Homebrew prefix,
      # which no login shell has put on PATH by the time the role runs the installer. That was
      # found by running the role in a bare ubuntu:24.04 container, not here.
      #
      # The clone is the checkout itself, not the published repo -- otherwise CI would provision
      # from main and pass on a pull request whose own install.sh is broken.
      #
      # Staged under /tmp rather than cloned from the workspace in place: the account this role
      # creates has to read the source, and the runner's home is not somewhere to assume a
      # traversable mode. A cross-ownership file:// clone itself is fine -- checked -- so the copy
      # is only about reachability.
      - name: Provision a test account, then prove the second run is a no-op
        run: |
          cp -r "$GITHUB_WORKSPACE" /tmp/dotfiles-src
          chmod -R a+rX /tmp/dotfiles-src
          # The staged copy is at whatever ref this run checked out, which on a pull request is
          # not main -- so name the commit rather than a branch that may not exist locally.
          # Its own inventory: the checked-in one is empty so that a run given no host provisions
          # none, and a job that provisions has to name the host it means.
          cat > /tmp/ci-inventory.ini <<INV
          [dev]
          localhost ansible_connection=local

          [dev:vars]
          ansible_python_interpreter=/usr/bin/python3
          INV
          cat > /tmp/ci-vars.yml <<YML
          dev_user_name: citest
          dev_user_comment: "CI test account"
          dev_user_dotfiles_repo: file:///tmp/dotfiles-src
          dev_user_dotfiles_version: $(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)
          # The login shell is left at the role's default so this job exercises installing it.
          # It used to be pinned to /bin/bash because the default lived in the Homebrew prefix
          # and the role could not be trusted to have put it there; it is now the distribution's
          # zsh, installed from the same package task as the rest of the prerequisites.
          #
          # The runner ships Homebrew already, which is exactly the case worth testing: the role
          # has to take ownership of a prefix another account installed. Installing the whole
          # Brewfile is still forty-odd formulae and minutes per run, so that stays off and the
          # step below installs a single formula to prove the takeover worked.
          dev_user_brewfile: false
          # The home is the runner's root volume, which is the only one it has.
          dev_user_home_require_separate_fs: false
          dev_user_claude_code: true
          YML
          ansible-playbook -i /tmp/ci-inventory.ini ansible/site.yml -e @/tmp/ci-vars.yml
          ansible-playbook -i /tmp/ci-inventory.ini ansible/site.yml -e @/tmp/ci-vars.yml | tee second.log
          grep -qE "changed=0 .*failed=0" second.log || { echo "second run was not a no-op"; exit 1; }

      - name: The account it produced
        run: |
          sudo test -L /home/citest/.zshrc || { echo ".zshrc is not a link"; exit 1; }
          sudo test -f /home/citest/.claude/settings.json || { echo "settings.json missing"; exit 1; }
          sudo test ! -L /home/citest/.claude/settings.json || { echo "settings.json should be generated, not linked"; exit 1; }
          # HOME_MODE on Ubuntu, which the role neither sets nor works around.
          [ "$(stat -c %a /home/citest)" = "750" ] || { echo "home is $(stat -c %a /home/citest), not 750"; exit 1; }
          [ "$(getent passwd citest | cut -d: -f7)" = "/usr/bin/zsh" ] || { echo "login shell is not zsh"; exit 1; }
          sudo -u citest -H /home/citest/.local/bin/claude --version

      # The point of the whole change. The runner installed Homebrew as somebody else, so this
      # passes only if the role took the prefix over -- and installing is the operation that
      # ownership actually gates. Under the previous group/readonly sharing this was the thing
      # that did not work: the account could run the binaries and could not add to them.
      - name: The account owns Homebrew and can install with it
        # From /, not the workspace: a step runs in $GITHUB_WORKSPACE, which lives under the
        # runner's own 0750 home, and brew refuses to start when it cannot stat its working
        # directory -- which citest cannot, because it is not the runner.
        run: |
          owner="$(stat -c %U /home/linuxbrew/.linuxbrew)"
          [ "$owner" = "citest" ] || { echo "prefix owned by $owner, not citest"; exit 1; }
          cd /
          sudo -u citest -H /home/linuxbrew/.linuxbrew/bin/brew install hello
          sudo -u citest -H /home/linuxbrew/.linuxbrew/bin/hello --version | head -1
